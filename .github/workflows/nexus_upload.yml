name: Upload To Nexus

on:
  workflow_dispatch:
    inputs:
      upload_to_nexus:
        description: "Upload the Windows portable package to Nexus"
        required: true
        default: true
        type: boolean

# Test branch: Windows upload is opt-in; Linux and macOS packages are
# artifact-only for manual Nexus upload.
# Future upload configuration should use NEXUS_API_KEY, NEXUS_MOD_ID and
# NEXUS_FILE_ID (the Nexus "Group ID" for the specific file).

jobs:
  # This workflow is its own run, so it cannot reach compile.yml's artifacts:
  # it builds the checkers it needs. Three arches, since the publish steps
  # below cover Windows, Linux and OSX from the one job. Only momi-gml-check
  # is built: momi-gml-probe executes GML and never ships.
  checker:

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: win-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: osx-x64
            os: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build momi-gml-check
        run: cargo build --release --manifest-path tools/checker/Cargo.toml --target ${{ matrix.target }} --bin momi-gml-check
      - name: Upload the ${{ matrix.arch }} checker
        uses: actions/upload-artifact@v4
        with:
          name: checker-${{ matrix.arch }}
          path: tools/checker/target/${{ matrix.target }}/release/momi-gml-check*
          if-no-files-found: error

  nexus_package:
    needs: checker

    strategy:
      fail-fast: false
      matrix:
        project: [ModsOfMistriaGUI]
        arch: [win-x64]
        os: [ubuntu-latest]
        configuration: [Release]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure ImageSharp license
        shell: bash
        env:
          SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
        run: |
          if [ -z "$SIXLABORS_LICENSE" ]; then
            echo "::error::SIXLABORS_LICENSE secret is required for ImageSharp 4.x builds."
            exit 1
          fi
          printf '%s' "$SIXLABORS_LICENSE" > sixlabors.lic
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download the checkers
        uses: actions/download-artifact@v4
        with:
          pattern: checker-*
          path: tools/checker/staged
      - name: Lay the checkers out per RID
        run: |
          for arch in win-x64 linux-x64 osx-x64; do
            mkdir -p tools/checker/dist/$arch
            cp tools/checker/staged/checker-$arch/momi-gml-check* tools/checker/dist/$arch/
          done
          ls -lR tools/checker/dist

      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build
      - name: Test
        run: dotnet test

      - name: Get Assembly Version
        run: |
          VERSION=$(dotnet msbuild -nologo -verbosity:quiet -getProperty:AssemblyVersion ModsOfMistriaGUI)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
        
      - name: Compile Windows portable
        run: dotnet publish ModsOfMistriaGUI -c Release -r win-x64 -p:PublishSingleFile=false -p:PublishReadyToRun=false -p:IncludeAllContentForSelfExtract=false -o Release/windows
      - name: Zip Windows portable
        run: (cd Release/windows && zip -r "../AIM-${{ env.APP_VERSION }}-windows-portable.zip" .)

      - name: Compile Linux portable
        run: dotnet publish ModsOfMistriaGUI -c Release -r linux-x64 -p:PublishSingleFile=false -p:PublishReadyToRun=false -p:IncludeAllContentForSelfExtract=false -o Release/linux
      - name: Zip Linux portable
        run: (cd Release/linux && zip -r "../AIM-${{ env.APP_VERSION }}-linux-portable.zip" .)

      - name: Compile macOS portable
        run: dotnet publish ModsOfMistriaGUI -c Release -r osx-x64 -p:PublishSingleFile=false -p:PublishReadyToRun=false -p:IncludeAllContentForSelfExtract=false -o Release/macos
      - name: Zip macOS portable
        run: (cd Release/macos && zip -r "../AIM-${{ env.APP_VERSION }}-macos-portable.zip" .)

      - name: Upload test artifacts to GitHub Actions only
        uses: actions/upload-artifact@v4
        with:
          name: nexus-test-package-${{ env.APP_VERSION }}
          path: Release/AIM-*.zip
          if-no-files-found: error

      # Windows upload is opt-in. This branch is the only place where the Nexus
      # upload is being tested; main remains package-only until the test passes.
      - name: Upload Windows test package to Nexus
        if: ${{ inputs.upload_to_nexus == true }}
        uses: Nexus-Mods/upload-action@d0321c96e04e91da2caf74cad0c8824f4c748f99 # v1.0.0-beta.4
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_group_id: ${{ secrets.NEXUS_FILE_ID_WINDOWS }}
          filename: Release/AIM-${{ env.APP_VERSION }}-windows-portable.zip
          version: ${{ env.APP_VERSION }}
          display_name: "AIM Windows test"
          description: "Temporary Windows package for Nexus upload testing"
